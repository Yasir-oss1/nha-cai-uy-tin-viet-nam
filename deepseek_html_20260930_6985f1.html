<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting • 5s</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05060a;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Animated aurora background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 12s ease-in-out infinite;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #4f7cff, transparent 70%);
      top: -120px;
      left: -120px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #b85cff, transparent 70%);
      bottom: -140px;
      right: -100px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #00e5c7, transparent 70%);
      top: 40%;
      right: 15%;
      animation-delay: -8s;
      opacity: 0.35;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.08); }
      66% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* Grid overlay for depth */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      pointer-events: none;
      z-index: 1;
    }

    /* Main glass card */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 18, 28, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 32px;
      padding: 3rem 2.25rem 2.25rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 30px 80px -20px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 1px 0 rgba(255, 255, 255, 0.1) inset;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      overflow: hidden;
    }

    /* Top gradient line accent */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #6da8ff, #b280ff, transparent);
      opacity: 0.8;
    }

    /* Circular timer with neon ring */
    .ring-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 3;
    }

    .ring-bar {
      fill: none;
      stroke: url(#neonGrad);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.12s linear;
      filter: drop-shadow(0 0 8px rgba(109, 168, 255, 0.7));
    }

    /* Center number */
    .count {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1rem;
    }

    .count-num {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #a9c2e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      filter: drop-shadow(0 4px 20px rgba(120, 170, 255, 0.4));
    }

    .count-unit {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: #7d8fa8;
      padding-left: 0.35em;
      font-weight: 500;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    /* URL section */
    .url-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
    }

    .url-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #5a6b82;
      font-weight: 600;
    }

    .url-pill {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .url-pill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(120, 170, 255, 0.08) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }

    .url-pill:hover {
      border-color: rgba(120, 170, 255, 0.35);
      background: rgba(120, 170, 255, 0.05);
      box-shadow: 0 0 24px -6px rgba(120, 170, 255, 0.35);
    }

    .url-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #4f7cff, #b85cff);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(120, 100, 255, 0.45);
    }

    .url-icon svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .url-text {
      font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      color: #c5d3e6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
      position: relative;
      z-index: 1;
    }

    /* Status bar */
    .status {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 1rem;
      background: rgba(109, 168, 255, 0.07);
      border: 1px solid rgba(109, 168, 255, 0.15);
      border-radius: 100px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6da8ff;
      box-shadow: 0 0 10px #6da8ff, 0 0 20px rgba(109, 168, 255, 0.5);
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .status-text {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #8fa8c4;
      font-weight: 600;
    }

    /* Progress bar at bottom */
    .progress-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #4f7cff, #b85cff, #00e5c7);
      transform-origin: left;
      transition: transform 0.12s linear;
      box-shadow: 0 0 12px rgba(120, 150, 255, 0.8);
    }

    @media (max-width: 440px) {
      .card {
        padding: 2.5rem 1.5rem 1.75rem;
        border-radius: 26px;
        gap: 1.5rem;
      }
      .ring-wrap {
        width: 150px;
        height: 150px;
      }
      .count-num {
        font-size: 3.7rem;
      }
      .url-text {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <!-- Animated background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">
    <!-- Circular countdown ring -->
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <defs>
          <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f7cff" />
            <stop offset="50%" stop-color="#6da8ff" />
            <stop offset="100%" stop-color="#b85cff" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="60" cy="60" r="52" />
        <circle 
          class="ring-bar" 
          cx="60" 
          cy="60" 
          r="52" 
          stroke-dasharray="326.73" 
          stroke-dashoffset="0"
          id="ringBar"
        />
      </svg>
      <div class="count">
        <div class="count-num" id="countNum">5</div>
        <div class="count-unit">sec</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- URL display -->
    <div class="url-section">
      <div class="url-label">Redirecting to</div>
      <div class="url-pill">
        <div class="url-icon">
          <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <span class="url-text" id="urlText">https://12betsmart.link/</span>
      </div>
    </div>

    <!-- Status indicator -->
    <div class="status">
      <span class="pulse-dot"></span>
      <span class="status-text">Please wait</span>
    </div>

    <!-- Bottom progress strip -->
    <div class="progress-strip">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    (function() {
      const REDIRECT_URL = "https://12betsmart.link/";
      const TOTAL_SECONDS = 5;
      const CIRCUMFERENCE = 326.73;

      const countNum = document.getElementById('countNum');
      const ringBar = document.getElementById('ringBar');
      const urlText = document.getElementById('urlText');
      const progressFill = document.getElementById('progressFill');

      // Sync URL text
      urlText.textContent = REDIRECT_URL;

      let remaining = TOTAL_SECONDS * 10;
      const totalTenths = TOTAL_SECONDS * 10;

      countNum.textContent = Math.ceil(remaining / 10);
      ringBar.style.strokeDashoffset = '0';
      progressFill.style.transform = 'scaleX(1)';

      function updateTimer() {
        if (remaining <= 0) {
          countNum.textContent = '0';
          ringBar.style.strokeDashoffset = CIRCUMFERENCE;
          progressFill.style.transform = 'scaleX(0)';
          window.location.href = REDIRECT_URL;
          return;
        }

        remaining -= 1;
        const elapsed = totalTenths - remaining;
        const progress = elapsed / totalTenths;

        // Ring depletion
        ringBar.style.strokeDashoffset = CIRCUMFERENCE * progress;

        // Bottom bar depletion (scaleX from 1 → 0)
        progressFill.style.transform = `scaleX(${1 - progress})`;

        // Number countdown
        let displaySeconds = Math.ceil(remaining / 10);
        if (displaySeconds < 0) displaySeconds = 0;
        countNum.textContent = displaySeconds;
      }

      const interval = setInterval(updateTimer, 100);

      // Backup redirect
      setTimeout(() => {
        clearInterval(interval);
        window.location.href = REDIRECT_URL;
      }, TOTAL_SECONDS * 1000 + 80);

      window.addEventListener('beforeunload', () => clearInterval(interval));
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="5;url=https://12betsmart.link/">
  </noscript>
</body>
</html>
